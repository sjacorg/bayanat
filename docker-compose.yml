# Production stack. See docs/deployment/docker.md.
# Compose reads ./.env for both variable substitution here and the app's
# own configuration, so there is a single file to generate and back up.

# The app and both workers must see identical application data. Declared once
# here rather than with volumes_from, which is deprecated in the Compose spec
# and silently inherits every mount of the service it copies.
x-app-volumes: &app-volumes
  - './backups:/app/backups/:rw'
  - '${MEDIA_PATH:-./enferno/media}:/app/enferno/media/:rw'
  - './enferno/imports:/app/enferno/imports/:rw'
  - './logs/:/app/logs/:rw'
  - './config.json:/app/config.json:rw'
  # Deliberately not configurable. Compose substitutes the variables in this
  # file from ./.env, so pointing the app at a different file would let the two
  # diverge and hand the app credentials the database was never created with.
  - './.env:/app/.env:ro'

x-logging: &logging
  # json-file grows without bound by default; a long-running deployment
  # will fill the host disk with container logs otherwise.
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    # PG major upgrades (15 -> 16) require a dump/restore of postgres_data
    image: 'postgis/postgis:16-3.5@sha256:a780ff6331b384e4c6d1033d5c42f4fe1270721b3e19260448241fa1b64a7637'
    # postgis/postgis publishes amd64 only; runs emulated on ARM hosts
    platform: linux/amd64
    user: postgres
    restart: unless-stopped
    logging: *logging
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - 'postgres_data:/var/lib/postgresql/data:rw'
    expose:
      - '5432'
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/run/postgresql
    healthcheck:
      test: "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"
      interval: 3s
      retries: 10

  redis:
    image: 'redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99'
    user: redis
    restart: unless-stopped
    logging: *logging
    expose:
      - '6379'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    # password is written to a config file in-container, never passed via argv
    command: sh -c 'echo "requirepass $$REDIS_PASSWORD" > /tmp/redis.conf && exec redis-server /tmp/redis.conf'
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - 'redis_data:/data:rw'
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG" ]
      interval: 3s
      retries: 10

  bayanat:
    build:
      context: .
      dockerfile: ./flask/Dockerfile
      args:
        - ROLE=flask
    restart: unless-stopped
    logging: *logging
    environment:
      - UWSGI_PROCESSES=${UWSGI_PROCESSES:-4}
      - UWSGI_THREADS=${UWSGI_THREADS:-2}
      - UWSGI_HARAKIRI=${UWSGI_HARAKIRI:-300}
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    expose:
      - '5000'
    healthcheck:
      # /health touches both the database and Redis, so a green check means
      # the app can actually serve, not merely that the port is open.
      # X-Forwarded-Proto is required: with FORCE_HTTPS=True the app redirects
      # any request it believes arrived over plain HTTP, and nothing serves
      # HTTPS inside the container, so without it the check can never pass.
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:5000/health', headers={'X-Forwarded-Proto': 'https'})).read()" ]
      interval: 10s
      timeout: 5s
      retries: 12
      # First boot runs create-db and the admin bootstrap before uWSGI listens.
      start_period: 120s

  celery:
    build:
      context: .
      dockerfile: ./flask/Dockerfile
      args:
        - ROLE=celery
    restart: unless-stopped
    logging: *logging
    volumes: *app-volumes
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-ocr:
    build:
      context: .
      dockerfile: ./flask/Dockerfile
      args:
        - ROLE=celery-ocr
    restart: unless-stopped
    logging: *logging
    volumes: *app-volumes
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: 'caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d'
    restart: unless-stopped
    logging: *logging
    environment:
      - DOMAIN=${DOMAIN:-:80}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - './caddy/Caddyfile:/etc/caddy/Caddyfile:ro'
      - './enferno/static/:/app/static/:ro'
      # Issued certificates. Losing this volume means re-issuing on every
      # restart, which will hit Let's Encrypt rate limits.
      - 'caddy_data:/data:rw'
      - 'caddy_config:/config:rw'
    depends_on:
      bayanat:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    # Only capability Caddy needs: binding 80/443 as a non-root process.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
    healthcheck:
      # The site's own /healthz only answers on the configured DOMAIN, so probe
      # Caddy's local admin API instead, which is host-independent.
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/" ]
      interval: 10s
      retries: 5

volumes:
  redis_data:
  postgres_data:
  caddy_data:
  caddy_config:
