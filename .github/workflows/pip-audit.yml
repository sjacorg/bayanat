name: "Security: Python"
permissions:
  contents: read

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - uv.lock
  schedule:
    - cron: "19 20 * * *"

jobs:
  pip-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl libxml2-dev libxslt1-dev libgeos-dev
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run pip-audit
        # Audit the locked versions; a project-path audit only sees pyproject.toml ranges.
        run: |
          uv export --frozen --no-hashes --no-emit-project > requirements-locked.txt
          uv run pip-audit -r requirements-locked.txt --disable-pip --no-deps
