name: "Tests: pytest"

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest-shard:
    name: pytest (${{ matrix.name }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: specialized
            tests: tests/test_specialized.py
          - name: lookups-users
            tests: tests/test_lookup_crud.py tests/test_users.py
          - name: remaining
            tests: tests --ignore=tests/test_specialized.py --ignore=tests/test_lookup_crud.py --ignore=tests/test_users.py
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bayanat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d bayanat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ExifTool
        run: |
          sudo apt-get update -y
          sudo apt-get install -yq libimage-exiftool-perl

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Create test directories
        run: mkdir -p tests/imports

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-ci
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_HOST: localhost
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
        run: uv run pytest -v --durations=30 ${{ matrix.tests }}

  pytest:
    name: pytest
    if: ${{ always() }}
    needs: pytest-shard
    runs-on: ubuntu-22.04
    steps:
      - name: Check pytest shards
        env:
          RESULT: ${{ needs.pytest-shard.result }}
        run: test "$RESULT" = success
